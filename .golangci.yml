version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes:
        - G115 # integer conversions checked at boundaries
        - G304 # paths are scoped to configured dataDir / cacheDir
        - G703 # same
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
