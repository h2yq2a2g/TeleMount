<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TeleMount Logo">
  <defs>
    <linearGradient id="tm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="52%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <radialGradient id="tm-glow" cx="20%" cy="16%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tm-peak-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDF2FF" />
      <stop offset="100%" stop-color="#9BD4FF" />
    </linearGradient>
    <linearGradient id="tm-peak2-lit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF9FF" />
      <stop offset="100%" stop-color="#CBEAFF" />
    </linearGradient>
    <linearGradient id="tm-peak2-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9E1FF" />
      <stop offset="100%" stop-color="#86C4FA" />
    </linearGradient>
    <linearGradient id="tm-dart-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8F3FF" />
      <stop offset="100%" stop-color="#93D5FF" />
    </linearGradient>
    <filter id="tm-shadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A1F5C" flood-opacity="0.24" />
    </filter>
  </defs>

  <!-- Rounded squircle background (alpine cyan to deep cobalt) -->
  <rect width="512" height="512" rx="116" fill="url(#tm-bg)" />
  <rect width="512" height="512" rx="116" fill="url(#tm-glow)" />

  <!-- Hero twin-peak mountain -->
  <g filter="url(#tm-shadow)">
    <!-- Secondary right peak -->
    <path d="M272 416 L348 286 Q356 274 364 286 L440 402 Q448 416 432 416 Z" fill="url(#tm-peak2-lit)" />
    <path d="M356 280 Q360 280 364 286 L440 402 Q448 416 432 416 L356 416 L366 356 L352 324 Z" fill="url(#tm-peak2-shade)" />

    <!-- Primary left-center peak -->
    <path d="M80 416 Q64 416 72 402 L188 206 Q198 190 208 206 L324 402 Q332 416 316 416 Z" fill="#FFFFFF" />
    <path d="M198 198 Q203 198 208 206 L324 402 Q332 416 316 416 L236 416 L202 338 L220 292 Z" fill="url(#tm-peak-shade)" />
  </g>

  <!-- Compact original split-delta send arrow (distinct from Telegram paper plane) -->
  <g filter="url(#tm-shadow)">
    <!-- Full smooth rounded delta dart -->
    <path d="M413 97 Q423 92 417 102 L363 216 Q358 226 355 215 L344 164 L293 148 Q282 144 294 140 Z" fill="#FFFFFF" />
    <!-- Shaded lower-right facet along symmetry spine -->
    <path d="M419 96 Q420 97 417 102 L363 216 Q358 226 355 215 L344 164 Z" fill="url(#tm-dart-shade)" />
  </g>
</svg>
